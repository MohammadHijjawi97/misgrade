name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . --group dev
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . --group dev
      - run: python -m pytest -m "not network"

  coverage:
    # Lines and branches, spawned grader workers included (coverage's multiprocessing support).
    # The floor is the measured total when it was last raised, minus a point; it goes to 90
    # once every part is implemented.
    name: coverage floor
    runs-on: ubuntu-latest
    env:
      COVERAGE_FLOOR: "90"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . --group dev
      - run: python -m coverage run -m pytest -m "not network"
      - run: python -m coverage combine
      - name: Check the floor
        run: python -m coverage report --fail-under="$COVERAGE_FLOOR"
      - name: Coverage in the job summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if total=$(python -m coverage report --format=total --precision=1); then
            echo "Coverage (lines and branches): ${total}% (floor ${COVERAGE_FLOOR}%)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Coverage: not measured (the tests did not finish)" >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: The wheel ships the schema, the seeds and py.typed
        run: |
          python -m zipfile -l dist/*.whl > contents.txt
          grep -q "misgrade/schema/grader-card.schema.json" contents.txt
          grep -q "misgrade/seeds/number.jsonl" contents.txt
          grep -q "misgrade/py.typed" contents.txt

  # Builder D appends the selftest, action and pre-commit jobs below this line.
