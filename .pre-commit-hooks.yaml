# misgrade for pre-commit (https://pre-commit.com). Owner: builder D.
# Skeleton: the hook is declared; misgrade audit is not implemented yet.
#
# misgrade-audit audits one grader and fails the commit when a --fail-on condition holds.
# Pass the grader and the gate in `args`, for example:
#
#   - repo: https://github.com/MohammadHijjawi97/misgrade
#     rev: v0.1.0
#     hooks:
#       - id: misgrade-audit
#         args: [rewards.py:compute_score, --type=number, --budget=300, "--fail-on=fp_rate>0"]
#         files: ^rewards\.py$
#
# It runs the grader (in a worker process), so keep the budget small for commit-time use.
- id: misgrade-audit
  name: misgrade audit
  description: Audit a grader with certified equivalent and certified wrong answers; fails when a --fail-on condition holds. No model calls.
  entry: misgrade audit
  language: python
  pass_filenames: false
  files: '\.(py|json|jsonl|ya?ml)$'
  require_serial: true
