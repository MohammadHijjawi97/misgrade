# misgrade for pre-commit (https://pre-commit.com). Owner: builder D.
#
# misgrade-audit audits one grader and fails the commit when a --fail-on condition holds (exit
# code 1; 2 for bad arguments, 3 when the grader cannot be loaded). It writes no files unless
# you pass --format (and --out). Pass the grader and the gate in `args`, and restrict `files` to
# the grader's source, for example:
#
#   - repo: https://github.com/MohammadHijjawi97/misgrade
#     rev: v0.1.0
#     hooks:
#       - id: misgrade-audit
#         args: [rewards.py:compute_score, --type=number, --budget=300, --faults=none, "--fail-on=fp>0,fn>0"]
#         files: ^rewards\.py$
#
# It runs the grader (in a worker process) on a few hundred cases, so keep the budget small for
# commit-time use; --faults=none skips the slower runtime-fault checks. If the grader imports
# packages, list them in `additional_dependencies`.
- id: misgrade-audit
  name: misgrade audit
  description: Audit a grader with certified equivalent and certified wrong answers; fails when a --fail-on condition holds. No model calls.
  entry: misgrade audit --format none
  language: python
  pass_filenames: false
  files: '\.(py|json|jsonl|ya?ml)$'
  require_serial: true
