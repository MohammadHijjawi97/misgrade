[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "misgrade"
dynamic = ["version"]
description = "Conformance tests for the graders that ML training and evaluation depend on: answers certified equivalent to the gold must keep their verdict, provably wrong ones must be rejected."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Mohammad Hijjawi", email = "mohammad.hijjawi1997@gmail.com" }]
keywords = [
    "rlvr",
    "reward-function",
    "verifier",
    "grader",
    "evaluation",
    "metamorphic-testing",
    "llm",
    "verl",
    "trl",
    "lm-eval",
    "inspect-ai",
    "mcp-server",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
# Kept minimal on purpose: no torch, ray or framework imports at install time. Adapters are
# duck-typed and import their framework only when a grader that needs it is loaded.
dependencies = [
    "sympy>=1.12",
    "mpmath>=1.3",
    "rich>=13.7",
]

[project.optional-dependencies]
# The MCP server (`misgrade mcp`), so a coding agent can audit the reward function it wrote.
mcp = ["mcp>=2.0"]
# Hypothesis-driven search over compositions of transforms (a seeded random search is used
# without it).
search = ["hypothesis>=6.100"]
# Frameworks whose built-in graders the adapters can load by name. Not needed to audit your own
# function written for these frameworks: the adapters call it without importing the framework.
verl = ["verl"]
trl = ["trl"]
inspect = ["inspect-ai"]
lmeval = ["lm-eval"]
verifiers = ["verifiers"]
math-verify = ["math-verify"]

[project.urls]
Homepage = "https://github.com/MohammadHijjawi97/misgrade"
Issues = "https://github.com/MohammadHijjawi97/misgrade/issues"
Changelog = "https://github.com/MohammadHijjawi97/misgrade/blob/main/CHANGELOG.md"
Design = "https://github.com/MohammadHijjawi97/misgrade/blob/main/docs/design.md"

[project.scripts]
misgrade = "misgrade.cli:main"

[project.entry-points.pytest11]
misgrade = "misgrade.pytest_plugin"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "coverage[toml]>=7.6",
    "hypothesis>=6.100",
    "jsonschema>=4.18",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.version]
path = "src/misgrade/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/misgrade"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = [
    "needs(*modules): skip while one of these misgrade modules is still a skeleton stub (it sets __stub__ = True)",
    "integration: runs the whole pipeline (transforms, runner, stats, outputs) against real graders",
    "slow: takes more than a few seconds",
    "network: downloads something (optional dataset loaders)",
]
filterwarnings = ["error"]
xfail_strict = true

[tool.coverage.run]
source = ["misgrade"]
branch = true
parallel = true
# Graders run in spawned worker processes; measure those too.
concurrency = ["multiprocessing", "thread"]
sigterm = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
    "^\\s*\\.\\.\\.$",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "C4"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
files = ["src/misgrade"]

[[tool.mypy.overrides]]
# Optional frameworks the adapters load lazily, and untyped math libraries.
module = [
    "sympy.*",
    "mpmath.*",
    "verl.*",
    "trl.*",
    "inspect_ai.*",
    "lm_eval.*",
    "verifiers.*",
    "math_verify.*",
    "mcp.*",
]
ignore_missing_imports = true
