# misgrade as a GitHub Action (composite). Owner: builder D.
#
# Inputs reach the scripts only through environment variables: no ${{ }} expression is ever
# interpolated into a run: script (a grader path or gate text cannot inject shell code).
#
# Uploading SARIF to code scanning needs `permissions: security-events: write` in the calling
# job; without it (pull requests from forks) the upload step fails without failing the action.
# The action fails exactly when misgrade exits with a non-zero code (a --fail-on gate held: 1).
name: misgrade
description: Audit a grader (reward function, verifier or eval scorer) with answers certified equivalent to the gold and answers certified wrong. No model calls, no API key.
author: Mohammad Hijjawi

branding:
  icon: check-square
  color: purple

inputs:
  grader:
    description: The grader to audit, e.g. rewards.py:compute_score or pkg.module:function.
    required: true
  adapter:
    description: callable, verl, trl, verifiers, lm-eval, inspect, openai or promptfoo (default detected).
    required: false
    default: ""
  type:
    description: Answer type (number, latex, interval, set, mc, bool, json, string) or auto.
    required: false
    default: auto
  seeds:
    description: A JSONL file of gold items (default the bundled seed items).
    required: false
    default: ""
  template:
    description: Response template (plain, boxed, gsm8k, answer-tag, final-answer, or text with {answer}).
    required: false
    default: plain
  budget:
    description: Maximum number of cases graded in the main and search phases.
    required: false
    default: "2000"
  seed:
    description: Seed for the case plan and the search (same seed, same cases).
    required: false
    default: "0"
  faults:
    description: Fault modes to check, comma-separated (repeat, order, concurrency, timeout, worker-death), or none. Empty means all.
    required: false
    default: ""
  fail-on:
    description: Fail the step when a condition holds, e.g. "fp_rate>0.01,self_validation_rate<1".
    required: false
    default: ""
  format:
    description: Output formats (comma-separated); sarif is added when upload-sarif is true.
    required: false
    default: card,markdown,sarif
  output-dir:
    description: Where the outputs are written.
    required: false
    default: misgrade-out
  step-summary:
    description: Add the Markdown summary to the job summary.
    required: false
    default: "true"
  upload-sarif:
    description: Upload the SARIF file to code scanning (needs security-events write permission).
    required: false
    default: "true"
  sarif-category:
    description: The code-scanning category of the uploaded SARIF (one per audited grader).
    required: false
    default: misgrade
  upload-artifact:
    description: Upload the output directory (grader card, reports) as a workflow artifact.
    required: false
    default: "true"
  artifact-name:
    description: Name of the uploaded artifact (unique per job when several audits run).
    required: false
    default: misgrade
  python-version:
    description: Python used to run misgrade and the grader.
    required: false
    default: "3.12"
  misgrade-version:
    description: A misgrade version on PyPI, "latest", or "local" to install the action's own source.
    required: false
    default: local

outputs:
  exit-code:
    description: The exit code of misgrade audit (0 ok, 1 a fail-on condition held, 2 usage, 3 grader not loadable, 4 internal).
    value: ${{ steps.audit.outputs.exit-code }}
  output-dir:
    description: The directory with the outputs.
    value: ${{ inputs.output-dir }}
  card:
    description: The path of the grader card, when the card format was written.
    value: ${{ steps.audit.outputs.card }}
  sarif:
    description: The path of the SARIF file, when the sarif format was written.
    value: ${{ steps.audit.outputs.sarif }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install misgrade
      shell: bash
      env:
        MG_VERSION: ${{ inputs.misgrade-version }}
        MG_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        case "$MG_VERSION" in
          local) python -m pip install "$MG_ACTION_PATH" ;;
          latest) python -m pip install misgrade ;;
          *) python -m pip install "misgrade==$MG_VERSION" ;;
        esac

    - name: Audit the grader
      id: audit
      shell: bash
      env:
        MG_GRADER: ${{ inputs.grader }}
        MG_ADAPTER: ${{ inputs.adapter }}
        MG_TYPE: ${{ inputs.type }}
        MG_SEEDS: ${{ inputs.seeds }}
        MG_TEMPLATE: ${{ inputs.template }}
        MG_BUDGET: ${{ inputs.budget }}
        MG_SEED: ${{ inputs.seed }}
        MG_FAULTS: ${{ inputs.faults }}
        MG_FAIL_ON: ${{ inputs.fail-on }}
        MG_FORMAT: ${{ inputs.format }}
        MG_OUT: ${{ inputs.output-dir }}
        MG_STEP_SUMMARY: ${{ inputs.step-summary }}
        MG_UPLOAD_SARIF: ${{ inputs.upload-sarif }}
      run: |
        set -uo pipefail
        formats="$MG_FORMAT"
        if [ "$MG_UPLOAD_SARIF" = "true" ]; then
          case ",$formats," in *,sarif,*) ;; *) formats="$formats,sarif" ;; esac
        fi
        args=(audit "$MG_GRADER" --type "$MG_TYPE" --template "$MG_TEMPLATE" --budget "$MG_BUDGET" --seed "$MG_SEED" --format "$formats" --out "$MG_OUT")
        if [ -n "$MG_ADAPTER" ]; then args+=(--adapter "$MG_ADAPTER"); fi
        if [ -n "$MG_SEEDS" ]; then args+=(--seeds "$MG_SEEDS"); fi
        if [ -n "$MG_FAULTS" ]; then args+=(--faults "$MG_FAULTS"); fi
        if [ -n "$MG_FAIL_ON" ]; then args+=(--fail-on "$MG_FAIL_ON"); fi
        status=0
        misgrade "${args[@]}" || status=$?
        echo "exit-code=$status" >> "$GITHUB_OUTPUT"
        if [ -f "$MG_OUT/grader-card.json" ]; then echo "card=$MG_OUT/grader-card.json" >> "$GITHUB_OUTPUT"; fi
        if [ -f "$MG_OUT/misgrade.sarif" ]; then echo "sarif=$MG_OUT/misgrade.sarif" >> "$GITHUB_OUTPUT"; fi
        if [ "$MG_STEP_SUMMARY" = "true" ] && [ -f "$MG_OUT/misgrade-summary.md" ]; then
          cat "$MG_OUT/misgrade-summary.md" >> "$GITHUB_STEP_SUMMARY"
        fi
        exit 0

    - name: Upload SARIF to code scanning
      if: ${{ inputs.upload-sarif == 'true' && steps.audit.outputs.sarif != '' }}
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        sarif_file: ${{ steps.audit.outputs.sarif }}
        category: ${{ inputs.sarif-category }}

    - name: Upload the outputs
      if: ${{ inputs.upload-artifact == 'true' }}
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.output-dir }}
        if-no-files-found: ignore

    - name: Exit with misgrade's exit code
      shell: bash
      env:
        MG_EXIT: ${{ steps.audit.outputs.exit-code }}
      run: exit "${MG_EXIT:-4}"
